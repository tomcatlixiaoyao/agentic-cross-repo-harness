name: Test and build portable Harness

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: python scripts/scan_public.py --root .

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: harness-windows-x64.exe
          - os: ubuntu-latest
            asset: harness-linux-x64
          - os: macos-14
            asset: harness-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --disable-pip-version-check pyinstaller==6.15.0
      - run: pyinstaller --clean --noconfirm harness.spec
      - name: Rename release asset
        shell: python {0}
        run: |
          from pathlib import Path
          source = Path("dist/harness.exe" if Path("dist/harness.exe").exists() else "dist/harness")
          source.rename(Path("dist/${{ matrix.asset }}"))
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum release-assets/**/harness-* > release-assets/SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" release-assets/**/harness-* release-assets/SHA256SUMS.txt --generate-notes --verify-tag --repo "${GITHUB_REPOSITORY}"
